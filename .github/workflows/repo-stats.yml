name: Generate Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=ClementeZeus&theme=dark&background=0d1117
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git add profile/*.svg

          if git diff --staged --quiet; then
            echo "No stat changes to commit."
            exit 0
          fi

          git commit -m "Auto-update profile stats SVGs"

          attempt=0
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after $attempt attempts."
              exit 1
            fi
            echo "Push rejected (race with another run). Rebasing and retrying ($attempt/5)..."
            sleep $((RANDOM % 10 + 5))
            git fetch origin main
            git rebase origin/main
          done
          
